   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.023203" transform="rotate(-0 27.36 36.023203)">GAN：训练时互相较量，生成时只需生成器</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">更新生成器时，梯度经过判别器，但判别器参数保持不动</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="108" y="160.455469" transform="rotate(-0 108 160.455469)">随机噪声 z</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="315" y="160.455469" transform="rotate(-0 315 160.455469)">生成器 G</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="525.6" y="160.455469" transform="rotate(-0 525.6 160.455469)">生成样本</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="525.6" y="275.655469" transform="rotate(-0 525.6 275.655469)">真实样本</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(752.796406 199.882531)">判别器 D</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(753.2 221.828406)">判断真假</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #c75369" x="482.4" y="86.4" transform="rotate(-0 482.4 86.4)">反馈：怎样让假样本更像真的</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(173.848828 277.790922)">D努力分清真假</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(141.466641 298.169234)">G努力让生成样本被判为真</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="393.269297" transform="rotate(-0 28.8 393.269297)">好看的几张图不代表分布覆盖充分；模式坍塌可以“很清晰，但总是长得差不多”。</text>
   </g>
