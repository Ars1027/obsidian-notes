   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.023203" transform="rotate(-0 27.36 36.023203)">评价生成模型：先问目标，再选指标</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">高似然、好看的样本、有用的表示，回答的是不同问题</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="162" y="159.481641" transform="rotate(-0 162 159.481641)">密度估计</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(120 219.813688)">未见真实样本</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(113 241.2)">获得多少概率？</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(120.850313 310.699313)">测试似然 / NLL</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(105.756563 329.510063)">VAE需说明ELBO下界</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="468" y="159.481641" transform="rotate(-0 468 159.481641)">采样质量</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(419 219.813688)">样本是否真实、</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(412 241.2)">多样、符合任务？</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(430.880625 310.699313)">IS / FID / KID</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(411.998438 329.510063)">人工评价 + 条件对齐</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="774" y="159.481641" transform="rotate(-0 774 159.481641)">潜在表示</text>
   </g>
   <g id="text_10">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(718 219.813688)">编码是否有信息、</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(725 241.2)">紧凑、可解释？</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(743.885625 310.699313)">聚类 / 压缩</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(731.885625 329.510063)">解耦 / 下游任务</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="414.869297" transform="rotate(-0 28.8 414.869297)">IS不直接参考真实数据；FID比较特征高斯统计；KID比较核相似性。任何一个都不是万能分数。</text>
   </g>
