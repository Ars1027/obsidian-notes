   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.392344" transform="rotate(-0 27.36 36.392344)">Flow Matching：条件直线，不保证生成轨迹笔直</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">训练拟合的是共享速度场；同一位置可能对应多个端点配对的不同监督方向</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="230.4" y="133.180078" transform="rotate(-0 230.4 133.180078)">训练构造：噪声—数据端点配对</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="698.4" y="133.180078" transform="rotate(-0 698.4 133.180078)">实际生成：沿共享速度场求解ODE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="393.269297" transform="rotate(-0 28.8 393.269297)">左右为概念示意，不是同一模型的数值结果。Reflow改善配对，使学到的运输轨迹更直、更便于少步采样。</text>
