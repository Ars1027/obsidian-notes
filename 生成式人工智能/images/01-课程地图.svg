   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.023203" transform="rotate(-0 27.36 36.023203)">全课程地图：复杂分布被拆成了什么？</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">沿同一条主线理解六类模型：训练学什么 → 生成怎么做</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(143.085938 150.093938)">自回归 AR</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(111 168.904688)">学下一部分的条件分布</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(91.8975 187.715438)">前缀 → 下一项 → 再接回前缀</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(465.789375 150.093938)">VAE</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(417 168.904688)">学潜在原因与条件生成</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(415.8975 187.715438)">先验 → 潜变量 → 解码</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(749.159063 150.093938)">归一化流 NF</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(723 168.904688)">学可逆变换与体积变化</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(725.44875 187.715438)">简单分布 与 复杂分布</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(157.439063 304.893937)">GAN</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(111 323.704687)">借真假比较学习生成器</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(109.8975 342.515437)">噪声 → 生成器 → 样本</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(442.986562 304.893937)">扩散 / Score</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(411 323.704687)">学多噪声尺度的去噪信息</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(409.8975 342.515437)">噪声 → 多步去噪 → 数据</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(740.721563 304.85925)">Flow Matching</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(729 323.739375)">学搬运分布的速度场</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(715.138125 342.550125)">噪声 → ODE积分 → 数据</text>
   </g>
  </g>
