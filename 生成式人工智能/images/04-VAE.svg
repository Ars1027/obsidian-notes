   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.023203" transform="rotate(-0 27.36 36.023203)">VAE：训练学会重构，生成从先验出发</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">编码器输出的是分布参数；重参数化保留随机性，并打通可微路径</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #168578" x="28.8" y="118.8" transform="rotate(-0 28.8 118.8)">训练</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="88.2" y="176.104688" transform="rotate(-0 88.2 176.104688)">数据 x</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(273.6 166.699313)">编码器</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(255.6 185.510063)">均值、标准差</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(508.874063 166.699313)">采样潜变量 z</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(487.598438 185.510063)">独立噪声 + 可微变换</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(790.2 166.699313)">解码器</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(791.383125 185.510063)">重构 x</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="237.6" y="291.580078" transform="rotate(-0 237.6 291.580078)">重建项：让潜变量保留输入信息</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="684" y="291.580078" transform="rotate(-0 684 291.580078)">KL正则：让近似后验靠近先验</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #3567b7" x="28.8" y="376.56" transform="rotate(-0 28.8 376.56)">生成</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="144" y="376.56" transform="rotate(-0 144 376.56)">先验随机采样 z    →    解码器    →    新样本</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="414.869297" transform="rotate(-0 28.8 414.869297)">两项要平衡：只重构可能留下潜空间孔洞；只压KL可能让潜变量失去输入信息。</text>
   </g>
