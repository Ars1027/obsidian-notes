   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #25364a" x="27.36" y="36.023203" transform="rotate(-0 27.36 36.023203)">归一化流：概率质量守恒，密度随体积变化</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="61.92" transform="rotate(-0 28.8 61.92)">可逆映射让给定数据能够唯一找回基础变量；体积修正让密度计算正确</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(94.2 162.590922)">简单基础分布</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(81.2 182.969234)">容易采样、算密度</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(427.6 162.590922)">可逆变换</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(427.6 182.969234)">逐层组合</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(745.8 162.590922)">复杂数据分布</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #25364a" transform="translate(726.176094 182.969234)">生成样本 / 评估密度</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #3567b7" x="291.6" y="141.84" transform="rotate(-0 291.6 141.84)">生成</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #168578" x="615.6" y="181.44" transform="rotate(-0 615.6 181.44)">反求潜变量</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="244.8" y="305.704687" transform="rotate(-0 244.8 305.704687)">空间拉伸 → 同样概率摊得更开 → 密度降低</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #25364a" x="680.4" y="305.704687" transform="rotate(-0 680.4 305.704687)">空间压缩 → 同样概率挤得更紧 → 密度提高</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66778b" x="28.8" y="386.069297" transform="rotate(-0 28.8 386.069297)">Jacobian行列式描述局部体积缩放；“精确可求密度”不等于求逆和生成都同样快。</text>
   </g>
  </g>
